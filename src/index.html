<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" />

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons (FontAwesome for social & project links compatibility) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <!-- SEO Meta Tags -->
    <meta name="title" content="Sinkaroid" />
    <meta name="description" content="Indrawan I. (sinkaroid) • Software Developer Portfolio" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sinkaroid" />
    <meta property="og:url" content="https://sinkaroid.org" />
    <meta property="og:title" content="Sinkaroid" />
    <meta property="og:description" content="Indrawan I. (sinkaroid) • Software Developer Portfolio" />
    <meta property="og:image" content="/icon.png" />
    <meta name="author" content="Sinkaroid" />
    <meta content="#09090B" name="theme-color" />

    <title>sinkaroid / indrawan i. portfolio</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem("nightMode") === "true") {
            document.documentElement.classList.add("dark-theme");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="app">
      <!-- Modern Glassmorphism Loader -->
      <div id="loader">
        <div class="loader-content">
          <div class="spinner"></div>
          <p>sinkaroid</p>
        </div>
      </div>
    </div>

    <script type="module" src="./main"></script>

    <style>
      body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
      }
      #loader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        color: #18181b;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .dark-theme #loader {
        background: #09090b;
        color: #fafafa;
      }
      .loader-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 0, 0, 0.05);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .dark-theme .spinner {
        border-color: rgba(255, 255, 255, 0.05);
        border-top-color: #3b82f6;
      }
      .loader-content p {
        font-family: 'Poppins', sans-serif !important;
        font-size: 1.25rem;
        letter-spacing: 0.2em;
        font-weight: 500;
        color: #71717a;
        margin: 0;
        text-transform: uppercase;
      }
      .dark-theme .loader-content p {
        color: #a1a1aa;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
