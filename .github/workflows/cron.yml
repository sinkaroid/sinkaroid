name: Cron and retrieve sinkaroid data

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch anime
        run: bun run ci/getAnime.ts
      - name: Fetch manga
        run: bun run ci/getManga.ts
      - name: Fetch game
        run: STEAM_API_KEY=${{ secrets.STEAM_API_KEY }} bun run ci/getGame.ts
      - name: Fetch repository
        run: bun run ci/getRepository.ts ${{ secrets.GH_TOKEN }}
      - name: Fetch repository SAS
        run: bun run ci/getRepositorySAS.ts ${{ secrets.GH_TOKEN }}
      - name: Commit files
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "chore: scheduled & auto synchronize data"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
